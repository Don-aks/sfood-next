name: CI #а что ещё есть?

on: #чуть понять?
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest #?? каждую строчку короче разобрать
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit #??
      - run: npm run lint
      - run: npm run build
